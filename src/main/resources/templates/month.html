<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Галочки</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap');

        :root {
            --ink: #102f75;
            --ink-light: rgba(16, 47, 117, 0.65);
            --paper: #e6e1d2;
            --grid-blue: rgba(70, 125, 180, 0.24);
            --grid-blue-light: rgba(70, 125, 180, 0.13);
            --red-line: rgba(190, 40, 45, 0.72);
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            padding: 34px 42px;
            color: var(--ink);
            font-family: "Caveat", "Comic Sans MS", cursive;
            font-size: 26px;

            background-color: var(--paper);
            background-image:
                    linear-gradient(to right, var(--grid-blue-light) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--grid-blue-light) 1px, transparent 1px),
                    linear-gradient(to right, var(--grid-blue) 1px, transparent 1px),
                    linear-gradient(to bottom, var(--grid-blue) 1px, transparent 1px);
            background-size:
                    12px 12px,
                    12px 12px,
                    60px 60px,
                    60px 60px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 54px;
            font-weight: 700;
            letter-spacing: 1px;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 8px;
        }

        form,
        div {
            box-sizing: border-box;
        }

        input,
        select,
        button {
            font-family: "Caveat", "Comic Sans MS", cursive;
            font-size: 24px;
            color: var(--ink);
            background: transparent;
            border: 2px solid var(--ink);
            border-radius: 0;
            padding: 4px 12px;
            outline: none;
            box-shadow: none;
        }

        input::placeholder {
            color: rgba(16, 47, 117, 0.55);
        }

        button {
            cursor: pointer;
            background: rgba(255, 255, 255, 0.12);
        }

        button:hover,
        select:hover,
        input:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        a {
            color: var(--ink);
            text-decoration: none;
            font-size: 28px;
        }

        a:hover {
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 5px;
        }

        p {
            font-size: 30px;
        }

        .table-wrap {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            margin-top: 26px;
            border: none;
            border-radius: 0;
            background: transparent;
            padding-bottom: 6px;

            scrollbar-width: thin;
            scrollbar-color: var(--ink) rgba(16, 47, 117, 0.12);
        }

        .table-wrap {
            scrollbar-width: thin;
            scrollbar-color: var(--ink) rgba(16, 47, 117, 0.12);
        }

        /* Chrome, Edge, Safari */
        .table-wrap::-webkit-scrollbar {
            height: 14px;
        }

        .table-wrap::-webkit-scrollbar-track {
            background: rgba(16, 47, 117, 0.08);
            border-top: 1px solid rgba(16, 47, 117, 0.35);
            border-bottom: 1px solid rgba(16, 47, 117, 0.35);
        }

        .table-wrap::-webkit-scrollbar-thumb {
            background:
                    repeating-linear-gradient(
                            -45deg,
                            var(--ink),
                            var(--ink) 3px,
                            rgba(16, 47, 117, 0.75) 3px,
                            rgba(16, 47, 117, 0.75) 6px
                    );

            border: 3px solid var(--paper);
            border-radius: 8px;
        }

        .table-wrap::-webkit-scrollbar-thumb:hover {
            background: var(--ink);
        }

        .table-wrap::-webkit-scrollbar-corner {
            background: transparent;
        }

        .galochki-table {
            border-collapse: collapse;
            border-spacing: 0;
            margin-bottom: 0;
            min-width: max-content;
            background: transparent;
        }

        .galochki-table th,
        .galochki-table td {
            width: 26px;
            min-width: 26px;
            max-width: 26px;
            height: 26px;
            padding: 0;
            text-align: center;
            color: var(--ink);
            border: none;
            background: transparent;
            font-weight: 500;
            box-sizing: border-box;
        }

        .galochki-table thead th {
            font-size: 22px;
            font-weight: 600;
            vertical-align: middle;
        }

        .activity-head,
        .activity-name {
            width: 250px !important;
            min-width: 250px !important;
            max-width: 250px !important;
            position: sticky;
            left: 0;
            z-index: 2;
            text-align: left !important;
            color: var(--ink);
            font-weight: 600;
            border-right: 3px solid var(--red-line) !important;
            padding-left: 8px !important;
            padding-right: 12px !important;
        }

        .activity-head {
            z-index: 4;
            font-size: 34px !important;
        }

        .activity-name {
            font-size: 26px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .week-separator {
            width: 26px !important;
            min-width: 26px !important;
            max-width: 26px !important;
            padding: 0 !important;
            background: transparent !important;
            border-right: none !important;
            border-left: 2px solid var(--red-line) !important;
            cursor: default;
            pointer-events: none;
        }

        .galochka-cell {
            position: relative;
            cursor: pointer;
            width: 26px;
            min-width: 26px;
            max-width: 26px;
            height: 26px;
            padding: 0 !important;
            line-height: 26px;
            white-space: nowrap;
            overflow: visible;
            user-select: none;
            font-size: 0;
        }

        .full-mark {
            position: relative;
            display: inline-block;
            width: 10px;
            margin-left: -4px;
            color: var(--ink);
            font-size: 20px;
            line-height: 26px;
            font-weight: 700;
            vertical-align: middle;
            transform: rotate(-4deg);
        }

        .full-mark:first-child {
            margin-left: 0;
        }

        .full-mark:nth-child(2n) {
            transform: rotate(2deg);
        }

        .full-mark:nth-child(3n) {
            transform: rotate(-7deg);
        }

        .half-mark {
            position: relative;
            display: inline-block;
            width: 8px;
            height: 20px;
            margin-left: -4px;
            vertical-align: middle;
        }

        .half-mark::after {
            content: "";
            position: absolute;
            left: 1px;
            top: 11px;
            width: 9px;
            height: 3px;
            border-radius: 2px;
            background: var(--ink);
            transform: rotate(45deg);
        }

        .edit-toggle {
            border: none;
            font-size: 34px;
            padding: 0 8px;
            vertical-align: middle;
        }

        .edit-panel {
            display: none;
            margin-bottom: 20px;
        }

        body.edit-mode .edit-panel {
            display: block;
        }

        .edit-col {
            display: none;
            width: 34px !important;
            min-width: 34px !important;
            max-width: 34px !important;
        }

        .edit-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .edit-inline-form {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0;
        }

        .view-title {
            display: block;
        }

        .edit-title-form {
            display: none;
            gap: 6px;
            align-items: center;
        }

        body.edit-mode .view-title {
            display: none;
        }

        body.edit-mode .edit-title-form {
            display: flex;
        }

        .edit-title-form input {
            width: 170px;
            height: 34px;
            font-size: 24px;
        }

        .week-start-disabled {
            position: relative;
            opacity: 0.65;
            pointer-events: none;
        }

        .week-start-disabled select {
            background:
                    repeating-linear-gradient(
                            -45deg,
                            rgba(16, 47, 117, 0.08),
                            rgba(16, 47, 117, 0.08) 4px,
                            transparent 4px,
                            transparent 8px
                    );
        }


        body.edit-mode .edit-col {
            display: table-cell;
        }

        .activity-edit-line {
            display: none;
            align-items: center;
            gap: 4px;
        }

        body.edit-mode .activity-edit-line {
            display: flex;
        }

        .edit-title-form {
            display: block;
            margin: 0;
        }

        .edit-title-form input {
            width: 190px;
            height: 28px;
            font-size: 22px;
            padding: 0 6px;
        }

        .erase-btn {
            border: none !important;
            background: transparent !important;
            padding: 0 !important;
            margin: 0;
            width: 24px;
            height: 28px;
            line-height: 28px;
            font-size: 22px;
        }

        .other-month {
            color: rgba(16, 47, 117, 0.35) !important;
            background: rgba(255, 255, 255, 0.12) !important;
        }

        .other-month.checked {
            color: rgba(16, 47, 117, 0.45) !important;
        }

        @media (max-width: 900px) {
            body {
                padding: 26px 18px;
                font-size: 22px;
            }

            h1 {
                font-size: 42px;
            }

            input,
            select,
            button {
                font-size: 21px;
                margin-bottom: 6px;
            }

            .activity-head,
            .activity-name {
                width: 220px !important;
                min-width: 220px !important;
                max-width: 220px !important;
            }
        }

        body.edit-mode .activity-name {
            cursor: grab;
        }

        body.edit-mode tr.dragging .activity-name {
            cursor: grabbing;
        }

        .group-row .group-name {
            font-size: 30px;
            font-weight: 700;
        }

        .group-view-title,
        .group-edit-placeholder {
            text-decoration: underline;
            text-underline-offset: 5px;
            display: inline-block;
        }

        .group-title-form input {
            width: 190px;
            height: 28px;
            font-size: 22px;
            padding: 0 6px;
        }

        .group-row.group-editing .group-view-title {
            display: none;
        }

        .group-title-form {
            display: none;
            margin: 0;
        }

        .group-row.group-editing .group-view-title,
        .group-row.group-editing .group-edit-placeholder {
            display: none !important;
        }

        .group-row.group-editing .group-title-form {
            display: inline-block !important;
        }

        .group-title-form input {
            width: 220px;
            height: 34px;
            font-size: 26px;
            font-weight: 700;
        }

        .group-row.group-editing .group-title-form {
            display: inline-block;
        }

        body.edit-mode .group-row .group-name {
            cursor: grab;
        }

        body.edit-mode tr.activity-row .activity-name {
            cursor: grab;
        }

        tr.dragging .activity-name {
            opacity: 0.45;
        }

        .group-edit-placeholder {
            display: none;
            opacity: 0.55;
        }

        body.edit-mode .group-row .group-view-title:empty + .group-edit-placeholder {
            display: inline;
        }

        .group-delete-btn {
            display: none !important;
        }

        body.edit-mode .group-row:hover .group-delete-btn {
            display: inline-block !important;
        }

        body.edit-mode .group-row:hover .group-delete-btn {
            display: inline-block;
        }

        .activity-delete-btn {
            display: none !important;
        }

        body.edit-mode tr.activity-row:hover .activity-delete-btn {
            display: inline-block !important;
        }

        .empty-group {
            display: none;
        }

        body.edit-mode .empty-group {
            display: table-row;
        }

        .summary-row td {
            height: 92px;
            vertical-align: top;
            border-top: 2px solid var(--ink) !important;
            padding-top: 5px !important;
        }

        .summary-label {
            font-size: 25px !important;
            font-weight: 700 !important;
        }

        .summary-day-cell {
            position: relative;
            font-size: 21px;
            overflow: visible;
        }

        .day-total {
            display: block;
            height: 25px;
            line-height: 25px;
        }

        .week-total-box {
            position: relative;
            z-index: 2;
            display: inline-block;
            min-width: 22px;
            margin-top: 3px;
            padding: 0 3px;
            line-height: 23px;
            font-size: 21px;
            font-weight: 700;
            border: 2px solid var(--ink);
            transform: rotate(-2deg);
            background: transparent;
        }

        .week-completed-mark {
            display: block;
            width: 48px;
            height: 42px;
            margin: 2px auto 0;
            object-fit: contain;
            transform: rotate(-5deg);
        }

        .summary-overhead-cell {
            position: relative;
            overflow: visible;
            pointer-events: none;
        }

        .overhead-value {
            position: absolute;
            top: 5px;
            left: 3px;
            width: 22px;
            font-size: 20px;
            font-weight: 700;
            text-align: center;
        }

        .overhead-arrow {
            position: absolute;
            top: 34px;
            left: -4px;
            width: 32px;
            font-size: 27px;
            line-height: 20px;
            font-weight: 700;
            text-align: center;
        }

        .galochki-table td.numeric-cell {
            width: 64px;
            min-width: 64px;
            max-width: 64px;
        }

        .numeric-value-input {
            width: 58px;
            height: 24px;
            padding: 0 3px;
            border: none;
            font-size: 19px;
            line-height: 24px;
            text-align: center;
            background: transparent;
            appearance: textfield;
        }

        .numeric-value-input::-webkit-inner-spin-button,
        .numeric-value-input::-webkit-outer-spin-button {
            margin: 0;
            appearance: none;
        }

        .numeric-value-input:focus {
            outline: 2px solid var(--ink);
            outline-offset: -2px;
        }
    </style>
</head>

<script>
    function applyGalochkaState(cell, rawValue) {
        const value = Number.parseFloat(rawValue) || 0;
        const pageType = cell.dataset.pageType;

        cell.dataset.value = String(value);

        if (pageType === 'NUMBER') {
            const input = cell.querySelector('.numeric-value-input');
            if (input) input.value = value === 0 ? '' : String(value);
            return;
        }

        cell.replaceChildren();

        if (pageType === 'BINARY') {
            if (value !== 0) {
                const mark = document.createElement('span');
                mark.className = 'full-mark';
                mark.textContent = '✓';
                cell.appendChild(mark);
            }
            return;
        }

        const fullMarks = Math.floor(value);
        const hasHalf = value % 1 >= 0.5;

        for (let i = 0; i < fullMarks; i++) {
            const mark = document.createElement('span');
            mark.className = 'full-mark';
            mark.textContent = '✓';
            cell.appendChild(mark);
        }

        if (hasHalf) {
            const halfMark = document.createElement('span');
            halfMark.className = 'half-mark';
            cell.appendChild(halfMark);
        }
    }

    document.addEventListener('click', function (event) {
        const cell = event.target.closest('.galochka-cell');

        if (!cell || cell.dataset.pageType === 'NUMBER') return;

        const params = new URLSearchParams();
        params.append('activityId', cell.dataset.activityId);
        params.append('date', cell.dataset.date);

        fetch('/api/galochki/click', {method: 'POST', body: params})
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сохранения галочки');
                return response.json();
            })
            .then(data => {
                applyGalochkaState(cell, data.value);
                window.location.reload();
            })
            .catch(error => {
                console.error(error);
                alert('Не удалось сохранить галочку');
            });
    });

    document.addEventListener('contextmenu', function (event) {
        const cell = event.target.closest('.galochka-cell');

        if (!cell) {
            return;
        }

        event.preventDefault();

        const activityId = cell.dataset.activityId;
        const date = cell.dataset.date;

        const params = new URLSearchParams();
        params.append('activityId', activityId);
        params.append('date', date);

        fetch('/api/galochki/reset', {
            method: 'POST',
            body: params
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка сброса галочки');
                }

                return response.json();
            })
            .then(data => {
                applyGalochkaState(cell, data.value);
                window.location.reload();
            })
            .catch(error => {
                console.error(error);
                alert('Не удалось сбросить значение');
            });
    });

    document.addEventListener('change', function (event) {
        const input = event.target.closest('.numeric-value-input');

        if (!input) return;

        const cell = input.closest('.galochka-cell');
        const params = new URLSearchParams();

        params.append('activityId', cell.dataset.activityId);
        params.append('date', cell.dataset.date);

        if (input.value.trim() !== '') params.append('value', input.value);

        fetch('/api/galochki/value', {method: 'POST', body: params})
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сохранения значения');
                return response.json();
            })
            .then(data => {
                applyGalochkaState(cell, data.value);
            })
            .catch(error => {
                console.error(error);
                alert('Не удалось сохранить значение');
            });
    });

    function toggleEditMode() {
        const editModeEnabled = document.body.classList.toggle('edit-mode');
        const url = new URL(window.location.href);

        if (editModeEnabled) {
            url.searchParams.set('edit', 'true');
        } else {
            url.searchParams.delete('edit');
        }

        window.history.replaceState({}, '', url);

        const tbody = document.getElementById('activityRows');

        if (tbody) {
            updateDraggableRows(tbody);
        }
    }

    document.addEventListener('submit', function (event) {
        const form = event.target.closest('.edit-title-form');

        if (!form) {
            return;
        }

        event.preventDefault();

        const input = form.querySelector('input[name="title"]');
        const activityId = form.querySelector('input[name="activityId"]').value;

        const params = new URLSearchParams();
        params.append('activityId', activityId);
        params.append('title', input.value);

        fetch('/activities/update', {
            method: 'POST',
            body: params
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка обновления');
                }

                const cell = form.closest('.activity-name');
                const viewTitle = cell.querySelector('.view-title');

                if (viewTitle) {
                    viewTitle.textContent = input.value;
                    input.dataset.original = input.value;
                }
            })
            .catch(error => {
                console.error(error);
                alert('Не удалось обновить');
            });
    });

    document.addEventListener('focusout', function (event) {
        const input = event.target.closest('.edit-title-form input[name="title"]');

        if (!input) {
            return;
        }

        if (input.value === input.dataset.original) {
            return;
        }

        input.form.requestSubmit();
    });

    document.addEventListener('dblclick', function (event) {
        if (!document.body.classList.contains('edit-mode')) {
            return;
        }

        const groupName = event.target.closest('.group-name');

        if (!groupName) {
            return;
        }

        const groupRow = groupName.closest('.group-row');

        if (!groupRow || !groupRow.dataset.groupId) {
            return;
        }

        groupRow.classList.add('group-editing');

        const input = groupRow.querySelector('.group-title-form input[name="title"]');

        if (input) {
            input.focus();
            input.select();
        }
    });

    function refreshGroupSelectOptions() {
        const select = document.querySelector('select[name="groupId"]');

        if (!select) {
            return;
        }

        select.querySelectorAll('option[data-group-id]').forEach(option => option.remove());

        let index = 1;

        document.querySelectorAll('.group-row').forEach(groupRow => {
            const groupId = groupRow.dataset.groupId;

            if (!groupId) {
                return;
            }

            const title = groupRow.querySelector('.group-view-title').textContent.trim();
            const option = document.createElement('option');

            option.value = groupId;
            option.dataset.groupId = groupId;
            option.textContent = title || 'Группа ' + index;

            select.appendChild(option);
            index++;
        });
    }

    document.addEventListener('submit', function (event) {
        const form = event.target.closest('.group-title-form');

        if (!form) {
            return;
        }

        event.preventDefault();

        const groupRow = form.closest('.group-row');
        const input = form.querySelector('input[name="title"]');
        const groupId = form.querySelector('input[name="groupId"]').value;

        const params = new URLSearchParams();
        params.append('groupId', groupId);
        params.append('title', input.value);

        fetch('/activity-groups/update', {
            method: 'POST',
            body: params
        }).then(response => {
            if (!response.ok) {
                throw new Error('Ошибка обновления группы');
            }

            const viewTitle = groupRow.querySelector('.group-view-title');

            if (viewTitle) {
                viewTitle.textContent = input.value;
            }

            input.dataset.original = input.value;
            groupRow.classList.remove('group-editing');
            refreshGroupSelectOptions();
        }).catch(error => {
            console.error(error);
            alert('Не удалось обновить группу');
        });
    });

    document.addEventListener('focusout', function (event) {
        const input = event.target.closest('.group-title-form input[name="title"]');

        if (!input) {
            return;
        }

        const groupRow = input.closest('.group-row');

        if (input.value === input.dataset.original) {
            groupRow.classList.remove('group-editing');
            return;
        }

        input.form.requestSubmit();
    });

    let draggedRows = [];
    let draggedType = null;
    let orderChanged = false;

    function updateWeeklyNormField(form) {
        const pageType = form.querySelector('.page-type-select');
        const normField = form.querySelector('.weekly-norm-field');
        const normInput = form.querySelector('input[name="weeklyNorm"]');

        if (!pageType || !normField || !normInput) return;

        const numeric = pageType.value === 'NUMBER';
        normField.style.display = numeric ? 'none' : '';
        normInput.disabled = numeric;

        if (numeric) normInput.value = '';
    }

    function updateDraggableRows(tbody) {
        const editable = document.body.classList.contains('edit-mode');

        tbody.querySelectorAll('.activity-row .activity-name').forEach(cell => {
            cell.draggable = editable;
        });

        tbody.querySelectorAll('.group-row .group-name').forEach(cell => {
            const groupRow = cell.closest('.group-row');

            cell.draggable =
                editable &&
                groupRow &&
                !!groupRow.dataset.groupId;
        });
    }

    function getGroupBlock(groupRow) {
        const rows = [groupRow];
        let next = groupRow.nextElementSibling;

        while (next && !next.classList.contains('group-row')) {
            rows.push(next);
            next = next.nextElementSibling;
        }

        return rows;
    }

    function insertRowsBefore(tbody, rows, targetRow) {
        rows.forEach(row => tbody.insertBefore(row, targetRow));
    }

    function insertRowsAfter(tbody, rows, targetRow) {
        const after = targetRow.nextElementSibling;

        rows.forEach(row => tbody.insertBefore(row, after));
    }

    function findGroupRowForActivity(activityRow) {
        let prev = activityRow.previousElementSibling;

        while (prev) {
            if (prev.classList.contains('group-row')) {
                return prev;
            }

            prev = prev.previousElementSibling;
        }

        return null;
    }

    function saveGroupOrder(tbody) {
        const pageId = tbody.dataset.pageId;

        const params = new URLSearchParams();
        params.append('pageId', pageId);

        tbody.querySelectorAll('.group-row[data-group-id]').forEach(row => {
            const groupId = row.dataset.groupId;

            if (groupId) {
                params.append('groupIds', groupId);
            }
        });

        fetch('/activity-groups/reorder', {
            method: 'POST',
            body: params
        }).then(response => {
            if (!response.ok) {
                throw new Error('Ошибка сохранения порядка групп');
            }
        }).catch(error => {
            console.error(error);
            alert('Не удалось сохранить порядок групп');
        });
    }

    function collectActivityGroups(tbody) {
        const result = [];

        tbody.querySelectorAll('.group-row').forEach(groupRow => {
            const rawGroupId = groupRow.dataset.groupId;
            const groupId = rawGroupId ? Number(rawGroupId) : null;

            const activityIds = [];
            let next = groupRow.nextElementSibling;

            while (next && !next.classList.contains('group-row')) {
                if (next.classList.contains('activity-row')) {
                    activityIds.push(Number(next.dataset.activityId));
                    next.dataset.groupId = rawGroupId || '';
                }

                next = next.nextElementSibling;
            }

            groupRow.classList.toggle('empty-group', activityIds.length === 0);

            result.push({
                groupId: groupId,
                activityIds: activityIds
            });
        });

        return result;
    }

    function saveActivityOrder(tbody) {
        const pageId = tbody.dataset.pageId;
        const payload = collectActivityGroups(tbody);

        fetch('/activities/reorder?pageId=' + encodeURIComponent(pageId), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        }).then(response => {
            if (!response.ok) {
                throw new Error('Ошибка сохранения порядка дел');
            }
        }).catch(error => {
            console.error(error);
            alert('Не удалось сохранить порядок дел');
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.page-create-form').forEach(form => {
            updateWeeklyNormField(form);

            const select = form.querySelector('.page-type-select');
            if (select) select.addEventListener('change', () => updateWeeklyNormField(form));
        });

        const tbody = document.getElementById('activityRows');

        if (!tbody) {
            return;
        }

        const weekChecks = document.querySelectorAll('.random-week-check');

        if (weekChecks.length > 0) {
            const monthKey = weekChecks[0].dataset.monthKey;
            const orderStorageKey = `week-check-order-v2-${monthKey}`;

            let variantsOrder;

            try {
                variantsOrder = JSON.parse(localStorage.getItem(orderStorageKey));
            } catch (error) {
                variantsOrder = null;
            }

            if (
                !Array.isArray(variantsOrder) ||
                variantsOrder.length !== 3
            ) {
                variantsOrder = [1, 2, 3];

                for (let i = variantsOrder.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));

                    [variantsOrder[i], variantsOrder[j]] =
                        [variantsOrder[j], variantsOrder[i]];
                }

                localStorage.setItem(
                    orderStorageKey,
                    JSON.stringify(variantsOrder)
                );
            }

            weekChecks.forEach(check => {
                const weekIndex = Number(check.dataset.weekIndex);
                const weekKey = check.dataset.checkKey;

                const rotationStorageKey =
                    `week-check-rotation-v2-${weekKey}`;

                let rotation = localStorage.getItem(rotationStorageKey);

                if (rotation === null) {
                    rotation = Math.floor(Math.random() * 9) - 4;

                    localStorage.setItem(
                        rotationStorageKey,
                        String(rotation)
                    );
                }

                const variant =
                    variantsOrder[weekIndex % variantsOrder.length];

                check.src = `/galochka-week-${variant}.png`;
                check.style.transform = `rotate(${rotation}deg)`;
            });
        }
        
        tbody.querySelectorAll('.galochka-cell').forEach(cell => {
            applyGalochkaState(cell, cell.dataset.value);
        });

        updateDraggableRows(tbody);

        tbody.addEventListener('dragstart', function (event) {
            if (!document.body.classList.contains('edit-mode')) {
                event.preventDefault();
                return;
            }

            if (event.target.closest('input, button, form')) {
                event.preventDefault();
                return;
            }

            const groupHandle = event.target.closest('.group-row .group-name');
            const activityHandle = event.target.closest('.activity-row .activity-name');

            if (groupHandle) {
                const groupRow = groupHandle.closest('.group-row');

                if (!groupRow.dataset.groupId) {
                    event.preventDefault();
                    return;
                }

                draggedType = 'group';
                draggedRows = getGroupBlock(groupRow);
            } else if (activityHandle) {
                draggedType = 'activity';
                draggedRows = [activityHandle.closest('.activity-row')];
            } else {
                event.preventDefault();
                return;
            }

            orderChanged = false;

            draggedRows.forEach(row => row.classList.add('dragging'));
        });

        tbody.addEventListener('dragend', function () {
            draggedRows.forEach(row => row.classList.remove('dragging'));

            if (orderChanged) {
                if (draggedType === 'group') {
                    saveGroupOrder(tbody);
                    saveActivityOrder(tbody);
                }

                if (draggedType === 'activity') {
                    saveActivityOrder(tbody);
                }
            }

            draggedRows = [];
            draggedType = null;
            orderChanged = false;
        });

        tbody.addEventListener('dragover', function (event) {
            if (!draggedRows.length) {
                return;
            }

            event.preventDefault();

            const targetRow = event.target.closest('tr');

            if (!targetRow || draggedRows.includes(targetRow)) {
                return;
            }

            const rect = targetRow.getBoundingClientRect();
            const before = event.clientY < rect.top + rect.height / 2;

            if (draggedType === 'group') {
                const targetGroupRow = targetRow.classList.contains('group-row')
                    ? targetRow
                    : findGroupRowForActivity(targetRow);


                if (!targetGroupRow || draggedRows.includes(targetGroupRow)) {
                    return;
                }

                if (!targetGroupRow.dataset.groupId) {
                    return;
                }

                orderChanged = true;

                if (before) {
                    insertRowsBefore(tbody, draggedRows, targetGroupRow);
                } else {
                    const targetBlock = getGroupBlock(targetGroupRow);
                    insertRowsAfter(tbody, draggedRows, targetBlock[targetBlock.length - 1]);
                }

                refreshGroupPlaceholders(tbody);
                return;
            }

            if (draggedType === 'activity') {
                orderChanged = true;

                if (targetRow.classList.contains('group-row')) {
                    tbody.insertBefore(draggedRows[0], targetRow.nextElementSibling);
                    return;
                }

                if (before) {
                    tbody.insertBefore(draggedRows[0], targetRow);
                } else {
                    tbody.insertBefore(draggedRows[0], targetRow.nextElementSibling);
                }
            }
        });
    });

    function refreshGroupPlaceholders(tbody) {
        let index = 1;

        tbody.querySelectorAll('.group-row').forEach(groupRow => {
            const placeholder = groupRow.querySelector('.group-edit-placeholder');

            if (!placeholder) {
                return;
            }

            if (!groupRow.dataset.groupId) {
                placeholder.textContent = 'Без группы';
                return;
            }

            placeholder.textContent = 'Группа ' + index;
            index++;
        });
    }
</script>

<body th:classappend="${edit} ? 'edit-mode'">
<h1>
    Галочки —
    <span th:text="${page.yearMonth()}">2026-04</span>

    <button type="button" class="edit-toggle" onclick="toggleEditMode()" title="Редактировать">
        ✎
    </button>
</h1>

<div style="margin-bottom: 16px;">
    <form method="get" action="/month" style="display: inline-block;">
        <input type="hidden" name="year" th:value="${page.yearMonth().year}">
        <input type="hidden" name="month" th:value="${page.yearMonth().monthValue}">

        <select name="pageId" onchange="this.form.submit()">
            <option th:each="option : ${page.pageOptions()}"
                    th:value="${option.id()}"
                    th:selected="${option.id().equals(page.pageId())}"
                    th:text="${option.title()}">
                Основная
            </option>
        </select>
    </form>
</div>

<div class="edit-panel">
    <div class="edit-row">
        <form method="post" action="/pages/update" class="edit-inline-form">
            <input type="hidden" name="pageId" th:value="${page.pageId()}">
            <input type="hidden" name="year" th:value="${page.yearMonth().year}">
            <input type="hidden" name="month" th:value="${page.yearMonth().monthValue}">

            <input type="text" name="title" th:value="${page.pageTitle()}" required>

            <span class="week-start-disabled" title="Пока нельзя менять первый день недели">
                <select disabled>
                    <option value="MONDAY">Понедельник</option>
                    <option value="TUESDAY">Вторник</option>
                    <option value="WEDNESDAY">Среда</option>
                    <option value="THURSDAY">Четверг</option>
                    <option value="FRIDAY">Пятница</option>
                    <option value="SATURDAY">Суббота</option>
                    <option value="SUNDAY">Воскресенье</option>
                </select>
            </span>

            <button type="submit">Сохранить страницу</button>
        </form>

        <form method="post" action="/pages/delete" class="edit-inline-form"
              onsubmit="return confirm('Удалить страницу полностью? Все дела и галочки тоже удалятся.');">
            <input type="hidden" name="pageId" th:value="${page.pageId()}">
            <button type="submit">Стереть страницу</button>
        </form>
    </div>

    <form method="post" action="/pages" class="edit-inline-form edit-row page-create-form">
        <input type="text" name="title" placeholder="Новая страница" required>

        <select name="pageType" class="page-type-select" required>
            <option value="HALF_STEP">Половинчатые галочки</option>
            <option value="BINARY">Обычные галочки</option>
            <option value="NUMBER">Числовые значения</option>
        </select>

        <span class="weekly-norm-field">
            <input type="number" name="weeklyNorm" min="0" step="0.01" placeholder="Недельная норма">
        </span>

        <select name="weekStartDay" required>
            <option value="MONDAY">Понедельник</option>
            <option value="TUESDAY">Вторник</option>
            <option value="WEDNESDAY">Среда</option>
            <option value="THURSDAY">Четверг</option>
            <option value="FRIDAY">Пятница</option>
            <option value="SATURDAY">Суббота</option>
            <option value="SUNDAY">Воскресенье</option>
        </select>

        <button type="submit">Создать страницу</button>
    </form>
</div>

<div style="margin-bottom: 16px;">
    <a th:href="@{/month(pageId=${page.pageId()}, year=${page.previousMonth().year}, month=${page.previousMonth().monthValue})}">        ← Предыдущий месяц
    </a>

    <a th:href="@{/month}" style="margin: 0 16px;">
        Текущий месяц
    </a>

    <a th:href="@{/month(pageId=${page.pageId()}, year=${page.nextMonth().year}, month=${page.nextMonth().monthValue})}">
        Следующий месяц →
    </a>
</div>

<div id="editPanel" class="edit-panel">
    <form method="post" action="/activities" class="edit-inline-form">
        <input type="hidden" name="pageId" th:value="${page.pageId()}">
        <input type="hidden" name="year" th:value="${page.yearMonth().year}">
        <input type="hidden" name="month" th:value="${page.yearMonth().monthValue}">

        <input type="text" name="title" placeholder="Новое дело" required>

        <select name="groupId">
            <option value="">Без группы</option>
            <option th:each="group, groupStat : ${page.groups()}"
                    th:if="${group.groupId() != null}"
                    th:value="${group.groupId()}"
                    th:data-group-id="${group.groupId()}"
                    th:text="${#strings.isEmpty(group.title()) ? 'Группа ' + (groupStat.index + 1) : group.title()}">
                Группа
            </option>
        </select>

        <button type="submit">Добавить дело</button>
    </form>

    <form method="post" action="/activity-groups" class="edit-inline-form edit-row">
        <input type="hidden" name="pageId" th:value="${page.pageId()}">
        <input type="hidden" name="year" th:value="${page.yearMonth().year}">
        <input type="hidden" name="month" th:value="${page.yearMonth().monthValue}">

        <input type="text" name="title" placeholder="Новая группа">
        <button type="submit">Добавить группу</button>
    </form>
</div>

<p th:if="${#lists.isEmpty(page.rows())}">
    Пока данных нет.
</p>

<div class="table-wrap">
    <table th:if="${!#lists.isEmpty(page.rows())}" class="galochki-table">
        <thead>
        <tr>
            <th class="activity-head">Дело</th>
            <th class="week-separator"></th>
            <th:block th:each="week, weekStat : ${page.weeks()}">
                <th th:each="day : ${week.days()}"
                    th:classappend="${!day.currentMonth()} ? ' other-month'">
                    <span th:text="${day.dayOfMonth()}">1</span>
                </th>

                <th th:if="${!weekStat.last}" class="week-separator"></th>
            </th:block>
        </tr>
        </thead>

        <tbody id="activityRows"
               th:data-page-id="${page.pageId()}"
               th:data-page-type="${page.pageType()}">
        <th:block th:each="group, groupStat : ${page.groups()}">
            <tr class="group-row"
                th:classappend="${#lists.isEmpty(group.rows())} ? 'empty-group'"
                th:data-group-id="${group.groupId()}">
                <td class="activity-name group-name">
                    <span class="group-view-title"
                          th:text="${#strings.isEmpty(group.title()) ? '' : group.title()}">
                    </span>

                    <span class="group-edit-placeholder"
                          th:text="${group.groupId() == null ? 'Без группы' : 'Группа ' + (groupStat.index + 1)}">
                        Группа
                    </span>

                    <form class="group-title-form" th:if="${group.groupId() != null}">
                        <input type="hidden" name="groupId" th:value="${group.groupId()}">

                        <input type="text"
                               name="title"
                               th:value="${group.title()}"
                               th:attr="data-original=${group.title()}">
                    </form>

                    <form method="post"
                          action="/activity-groups/delete"
                          th:if="${group.groupId() != null}"
                          onsubmit="return confirm('Удалить группу? Все дела перейдут в конец блока без группы.');"
                          style="display:inline;">
                        <input type="hidden" name="groupId" th:value="${group.groupId()}">
                        <input type="hidden" name="pageId" th:value="${page.pageId()}">
                        <input type="hidden" name="year" th:value="${page.yearMonth().year}">
                        <input type="hidden" name="month" th:value="${page.yearMonth().monthValue}">

                        <button type="submit"
                                class="erase-btn group-delete-btn"
                                title="Удалить группу">
                            ⌫
                        </button>
                    </form>
                </td>
                <td class="week-separator"></td>
                <td th:colspan="${page.weeks().size() * 8 - 1}"></td>
            </tr>

            <tr class="activity-row"
                th:each="row : ${group.rows()}"
                th:data-activity-id="${row.activityId()}"
                th:data-group-id="${group.groupId()}">
                <td class="activity-name">
                    <span class="view-title" th:text="${row.title()}"></span>

                    <div class="activity-edit-line">
                        <form class="edit-title-form">
                            <input type="hidden" name="activityId" th:value="${row.activityId()}">

                            <input type="text"
                                   name="title"
                                   th:value="${row.title()}"
                                   th:attr="data-original=${row.title()}"
                                   required>
                        </form>

                        <form method="post" action="/activities/delete"
                              onsubmit="return confirm('Удалить дело полностью? Галочки тоже удалятся.');">
                            <input type="hidden" name="activityId" th:value="${row.activityId()}">
                            <input type="hidden" name="pageId" th:value="${page.pageId()}">
                            <input type="hidden" name="year" th:value="${page.yearMonth().year}">
                            <input type="hidden" name="month" th:value="${page.yearMonth().monthValue}">

                            <button type="submit"
                                    class="erase-btn activity-delete-btn"
                                    title="Стереть дело">
                                ⌫
                            </button>
                        </form>
                    </div>
                </td>
                <td class="week-separator"></td>
                <th:block th:each="weekCells, weekStat : ${row.weeks()}">
                    <td th:each="cell, cellStat : ${weekCells.cells()}"
                        class="galochka-cell"
                        th:classappend="|${!page.weeks()[weekStat.index].days()[cellStat.index].currentMonth() ? 'other-month ' : ''}${page.pageType().name() == 'NUMBER' ? 'numeric-cell' : ''}|"
                        th:data-activity-id="${cell.activityId()}"
                        th:data-date="${cell.date()}"
                        th:data-value="${cell.value()}"
                        th:data-page-type="${page.pageType()}">

                        <input th:if="${page.pageType().name() == 'NUMBER'}"
                               type="number"
                               class="numeric-value-input"
                               step="any"
                               th:value="${cell.value() == '0' ? '' : cell.value()}"
                               aria-label="Числовое значение">
                    </td>

                    <td th:if="${!weekStat.last}" class="week-separator"></td>
                </th:block>
            </tr>
        </th:block>
        </tbody>
        <tfoot th:if="${page.weeklyNorm().signum() > 0}">
        <tr class="summary-row">
            <td class="activity-name summary-label">Итого</td>

            <td class="week-separator summary-overhead-cell">
        <span class="overhead-value"
              th:if="${!#lists.isEmpty(page.weekSummaries()) and page.weekSummaries()[0].incomingOverhead().signum() > 0}"
              th:text="${'+' + page.weekSummaries()[0].incomingOverhead().stripTrailingZeros().toPlainString()}">
        </span>
            </td>

            <th:block th:each="weekSummary, weekStat : ${page.weekSummaries()}">
                <td th:each="daySummary, dayStat : ${weekSummary.days()}"
                    class="summary-day-cell"
                    th:classappend="${!page.weeks()[weekStat.index].days()[dayStat.index].currentMonth()} ? ' other-month'">

                    <span class="day-total"
                          th:text="${daySummary.total().stripTrailingZeros().toPlainString()}">
                        0
                    </span>

                    <th:block th:if="${dayStat.last}"
                              th:with="effectiveTotal=${weekSummary.weekTotal().add(weekSummary.incomingOverhead())}">

                        <span class="week-total-box"
                              th:text="${effectiveTotal.stripTrailingZeros().toPlainString()}">
                            0
                        </span>

                        <img class="week-completed-mark random-week-check"
                             th:if="${effectiveTotal.compareTo(page.weeklyNorm()) >= 0}"
                             th:data-check-key="${page.pageId() + '-' + page.weeks()[weekStat.index].days()[0].date()}"
                             th:data-week-index="${weekStat.index}"
                             th:data-month-key="${page.pageId() + '-' + page.yearMonth()}"
                             alt="Норма выполнена">
                    </th:block>

                </td>

                <td th:if="${!weekStat.last}"
                    class="week-separator summary-overhead-cell">

            <span class="overhead-value"
                  th:if="${page.weekSummaries()[weekStat.index + 1].incomingOverhead().signum() > 0}"
                  th:text="${'+' + page.weekSummaries()[weekStat.index + 1].incomingOverhead().stripTrailingZeros().toPlainString()}">
            </span>

                    <span class="overhead-arrow"
                          th:if="${page.weekSummaries()[weekStat.index + 1].incomingOverhead().signum() > 0}">
                →
            </span>
                </td>
            </th:block>
        </tr>
        </tfoot>
    </table>
</div>

</body>
</html>
